version: 1

product:
  name: intentci
  purpose: Local-first verification that code changes satisfy approved product requirements.
  non_goals:
    - Hosted control plane
    - Replacing native test frameworks
    - Agent execution or supervision

policy:
  default_base: origin/main
  unknown_blocks: true
  unverified_blocks: true

execution:
  max_parallel: 4

requirements:
  - id: BUILD-001
    type: reliability
    title: IntentCI packages test cleanly
    statement: The IntentCI Go packages under cmd/ and internal/ must pass unit and integration tests.
    status: approved
    severity: blocking
    applies_to:
      include:
        - "cmd/**"
        - "internal/**"
        - "pkg/**"
        - "go.mod"
        - "go.sum"
    verification:
      mode: all
      checks:
        - go-test

checks:
  - id: go-test
    description: Run Go tests for IntentCI
    command: go test ./...
    profiles:
      - fast
      - full
    inputs:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "fixtures/**"
    timeout: 10m
    cache: success
