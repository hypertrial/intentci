name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o intentci ./cmd/intentci
      - name: Validate dogfood contract
        run: ./intentci validate
      - name: Version
        run: ./intentci version
      - name: Dogfood verify
        run: ./intentci verify --trust --all --format json --output /tmp/intentci.json

  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-X github.com/hypertrial/intentci/internal/version.Version=0.1.0" -o dist/intentci_linux_amd64 ./cmd/intentci
          GOOS=darwin GOARCH=amd64 go build -ldflags="-X github.com/hypertrial/intentci/internal/version.Version=0.1.0" -o dist/intentci_darwin_amd64 ./cmd/intentci
          GOOS=darwin GOARCH=arm64 go build -ldflags="-X github.com/hypertrial/intentci/internal/version.Version=0.1.0" -o dist/intentci_darwin_arm64 ./cmd/intentci
          ls -la dist
