name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Vet
        run: go vet ./...
      - name: Test with 100% coverage gate
        run: ./scripts/check-coverage.sh
      - name: Build
        run: go build -o intentci ./cmd/intentci
      - name: Compile dogfood
        run: ./intentci compile --strict
      - name: Version
        run: ./intentci version
      - name: Doctor
        run: ./intentci doctor
      - name: Dogfood verify
        run: ./intentci verify --all --no-cache --format json --output /tmp/intentci.json

  build-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p dist
          VER="${GITHUB_SHA::7}"
          for pair in linux/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-X github.com/hypertrial/intentci/internal/version.Version=1.0.0-dev+${VER}" \
              -o "dist/intentci_${GOOS}_${GOARCH}" ./cmd/intentci
          done
          ls -la dist
