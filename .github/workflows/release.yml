name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Coverage gate
        run: ./scripts/check-coverage.sh
      - name: Build release binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for pair in linux/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="dist/intentci_${GOOS}_${GOARCH}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags="-s -w -X github.com/hypertrial/intentci/internal/version.Version=${VERSION}" \
              -o "$out" ./cmd/intentci
            tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
          done
          (cd dist && sha256sum intentci_*.tar.gz > checksums.txt)
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
