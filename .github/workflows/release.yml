name: release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23.x"
          cache: true
      - name: Validate
        run: |
          go test -race ./...
          go vet ./...
          go run ./cmd/intentci --all
      - name: Build Apple Silicon archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage dist/release
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
              -ldflags="-s -w -X github.com/hypertrial/intentci/v2/internal/version.Version=$version" \
              -o dist/stage/intentci ./cmd/intentci
          tar -czf "dist/release/intentci_${version}_darwin_arm64.tar.gz" \
            -C dist/stage intentci
          cd dist/release
          shasum -a 256 "intentci_${version}_darwin_arm64.tar.gz" > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            dist/release/intentci_*.tar.gz
            dist/release/checksums.txt
          body_path: docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    needs: publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23.x"
          cache: true
      - name: Download and validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir downloaded
          cd downloaded
          shasum -a 256 -c checksums.txt
          archive="intentci_${GITHUB_REF_NAME#v}_darwin_arm64.tar.gz"
          test "$(tar -tzf "$archive")" = "intentci"
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          test "$(unpacked/intentci version)" = "${GITHUB_REF_NAME#v}"
      - name: Packaged binary smoke test
        run: |
          binary="$GITHUB_WORKSPACE/downloaded/unpacked/intentci"
          fixture="$(mktemp -d)"
          cd "$fixture"
          git init -q
          git config user.email intentci@example.com
          git config user.name IntentCI
          printf 'module example\n\ngo 1.23\n' > go.mod
          printf 'package example\n' > example.go
          "$binary" init
          git add .
          git commit -qm initial
          printf '\nconst Changed = true\n' >> example.go
          mkdir nested
          cd nested
          "$binary"
          cd ..
          "$binary" --all
